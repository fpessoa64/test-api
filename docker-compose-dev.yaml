version: '3.8'

services:
  test-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - LOG_FILE_PATH=/app/logs/test-api-dev.log
    volumes:
      - .:/app
      - ../logs:/app/logs
      - /app/node_modules
    command: npm run start:dev
    networks:
      - infra_observability

networks:
  infra_observability:
    external: true
